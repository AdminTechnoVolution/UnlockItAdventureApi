components:
  schemas:
    HealthServiceStatus:
      type: object
      properties:
        status:
          type: string
          example: connected
        uri:
          type: string
          example: configured
        error:
          type: string
        service:
          type: string
        user:
          type: string

    HealthResponseData:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
            - error
          example: ok
        name:
          type: string
          example: unlock-it-adventure-api
        version:
          type: string
          example: "1.0.0"
        environment:
          type: string
          example: development
        uptime:
          type: string
          example: "2 hours, 15 mins, 30 secs"
        timestamp:
          type: string
          format: date-time
          example: "2026-05-27T12:00:00.000Z"
        services:
          type: object
          properties:
            mongo:
              $ref: '#/components/schemas/HealthServiceStatus'
            redis:
              $ref: '#/components/schemas/HealthServiceStatus'
            mailer:
              $ref: '#/components/schemas/HealthServiceStatus'

    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              type: boolean
              example: true
            messages:
              type: array
              items:
                type: string
            data:
              $ref: '#/components/schemas/HealthResponseData'
