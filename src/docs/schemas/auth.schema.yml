components:
  schemas:
    DeviceSchema:
      type: object
      required:
        - fcmToken
        - platform
      properties:
        fcmToken:
          type: string
          description: Firebase Cloud Messaging device token
          example: "dK3xYz...:APA91b..."
        platform:
          type: string
          enum:
            - android
            - ios
          example: ios
        appVersion:
          type: string
          example: "1.0.0"
        deviceId:
          type: string
          example: "A1B2C3D4-E5F6-7890-ABCD-EF1234567890"

    SocialLoginSchema:
      type: object
      required:
        - authType
        - tokenId
        - device
      properties:
        authType:
          type: string
          enum:
            - google
            - apple
          example: google
        tokenId:
          type: string
          description: ID token returned by Google Sign-In or Sign in with Apple
          example: "eyJhbGciOiJSUzI1NiIsImtpZCI6Ij..."
        device:
          $ref: '#/components/schemas/DeviceSchema'

    RefreshTokenSchema:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Refresh token returned by social login
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    LogoutSchema:
      type: object
      required:
        - accessToken
        - refreshToken
        - fcmToken
      properties:
        accessToken:
          type: string
          description: Current JWT access token to revoke
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          description: Current JWT refresh token to revoke
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        fcmToken:
          type: string
          description: FCM device token to remove from the user devices list
          example: "dK3xYz...:APA91b..."