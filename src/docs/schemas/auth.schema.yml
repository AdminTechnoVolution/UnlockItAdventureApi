components:
  schemas:
    DeviceSchema:
      type: object
      required:
        - platform
      properties:
        fcmToken:
          type: string
          description: Firebase Cloud Messaging device token
          example: "dK3xYz...:APA91b..."
        platform:
          type: string
          enum:
            - android
            - ios
          example: ios
        appVersion:
          type: string
          example: "1.0.0"
        deviceId:
          type: string
          example: "A1B2C3D4-E5F6-7890-ABCD-EF1234567890"

    SocialLoginSchema:
      type: object
      required:
        - authType
        - tokenId
        - device
      properties:
        authType:
          type: string
          enum:
            - google
            - apple
          example: google
        tokenId:
          type: string
          description: ID token returned by Google Sign-In or Sign in with Apple
          example: "eyJhbGciOiJSUzI1NiIsImtpZCI6Ij..."
        device:
          $ref: '#/components/schemas/DeviceSchema'

    RefreshTokenSchema:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Refresh token returned by social login
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    LogoutSchema:
      type: object
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
          description: Current JWT access token to revoke
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          description: Current JWT refresh token to revoke
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        fcmToken:
          type: string
          description: FCM device token to remove from the user devices list (optional)
          example: "dK3xYz...:APA91b..."

    AuthUserSummary:
      type: object
      properties:
        username:
          type: string
          example: Guest_1716823456789_482
        fullName:
          type: string
          example: Jane Doe
        profileImageUrl:
          type: string
          nullable: true
          example: "https://lh3.googleusercontent.com/a/..."

    SocialLoginResponseData:
      type: object
      required:
        - accessToken
        - refreshToken
        - user
        - isNewUser
      properties:
        accessToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          $ref: '#/components/schemas/AuthUserSummary'
        isNewUser:
          type: boolean
          example: false

    RefreshTokenResponseData:
      type: object
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    SocialLoginResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              type: boolean
              example: true
            messages:
              type: array
              items:
                type: string
            data:
              $ref: '#/components/schemas/SocialLoginResponseData'

    RefreshTokenResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              type: boolean
              example: true
            messages:
              type: array
              items:
                type: string
            data:
              $ref: '#/components/schemas/RefreshTokenResponseData'

    LogoutResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            success:
              type: boolean
              example: true
            messages:
              type: array
              items:
                type: string
            data:
              nullable: true
              example: null