components:
  schemas:
    UpdateProfileSchema:
      type: object
      minProperties: 1
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 128
          example: "Jane Doe"
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: "^[a-zA-Z0-9_]+$"
          example: "jane_doe"
